# List of Jarvis projects
jarvis_projects:
  - name: "Linux Cluster Monitoring Agent"
    git_url: "/linux_sql"
    description: "Implemented a Linux-based resource monitoring solution using Bash scripts and PostgreSQL, then analyzed the system from a BSA perspective to understand its business value. Identified key hardware and usage metrics required for capacity planning and documented how the collected data supports decisions such as scaling servers or optimizing resource allocation. Validated that the Bash scripts, cron schedules, and SQL schema aligned with the intended reporting needs by tracing requirements to actual outputs. Created clear technical documentation and data interpretation notes to translate system behavior and collected metrics into actionable business insights."
  - name: "SQL Learning & RDBMS Practice"
    git_url: "/sql"
    description: "Completed SQL and RDBMS exercises while approaching each query as a business requirement and documenting the underlying business question it answered. Analyzed relational structures, validated data accuracy, and ensured query logic aligned with expected outcomes from a stakeholder perspective. Practiced converting informal questions into structured requirements and verifying results against test data. Developed disciplined documentation habits by writing query explanations and translating technical outputs into insights that support decision-making."
  - name: "BSA Fundamentals"
    git_url: "/bsa_fundamentals"
    description: "Executed a comprehensive BSA Fundamentals project focused on understanding a product request, breaking down business objectives, and documenting clear and structured requirements. Conducted requirements analysis to distinguish business needs from technical constraints and translated high-level goals into detailed functional and non-functional requirements. Explored the role of a Business Systems Analyst, gaining insight into how BSA work informs system design, stakeholder communication, and business decision-making. Documented assumptions, questions, and clarifications to simulate stakeholder interactions and ensure requirement completeness. Produced organized BRD- and SRD-style documentation that demonstrated the ability to express business logic, data needs, and expected system behavior clearly and analytically."
  - name: "Power BI Fundamnetals"
    git_url: "/powerbi"
    description: "Developed three interactive Power BI dashboards to deliver actionable insights across business sales, survey data, and stock performance. Built a Beverages Sales Dashboard analyzing Coca-Colas sales and operating profit across U.S. states with AI Q&A, key influencer visuals, and dynamic maps/matrices. Created a Data Professionals Survey Report transforming 600+ survey responses to highlight salary trends, job satisfaction, and skill popularity. Built a Stocks Dashboard integrating Alpha Vantage API data to visualize historical prices, trading volume, key financial metrics, and earnings estimates. Conducted data cleaning, transformation, and modeling, validated outputs, and documented assumptions and insights to translate technical metrics into clear business decisions"

# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
  - name: "Tier Recognition Feature"
    description: "Analyzed the business requirement to classify healthcare providers into Tier 1/2/3 groups and ensured the logic aligned with how members search for in-network care. Used SQL insert statements to update tier attributes in the source data and validated that changes moved correctly through the ETL pipeline into the final Elasticsearch layer. Performed data checks to confirm that tier values displayed accurately in the provider search and supported user filtering. Documented edge cases, expected behaviors, and validation steps to ensure the implementation met stakeholder expectations."
  - name: "Extended Hours Feature"
    description: "Supported the development of extended-hours filtering by consolidating provider schedule data from 10 source systems and validating how each mapped into the integrated data model. Analyzed business rules around after-5pm and weekend availability and ensured they were accurately represented across Informatica workflows, SQL Server stored procedures, and downstream transformations. Verified data propagation through the Oracle layer and final Elasticsearch index to confirm that schedules displayed correctly in the provider search. Conducted UI data checks, documented assumptions, and outlined test scenarios to ensure the feature met business requirements. Ensured the enhancement improved member and public access by enabling precise filtering based on extended availability."
  - name: "Client Coaching Data Revamp"
    description: "Redesigned a fragmented coaching dataset in Airtable by structuring information into standardized tables that reflected coaching workflows and reporting needs. Analyzed business requirements for monthly income tracking and automated email collection to streamline data intake from clients. Built no-code dashboards and visualizations to surface trends and insights for coaching decision-making. Validated data completeness and consistency across automated inputs and reporting views. Improved process efficiency by enabling faster and more accurate visibility into client progress."

