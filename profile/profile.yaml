summary: I am a Business Systems Analyst in training with a strong foundation in data engineering and analytics. My professional experience includes designing, validating, and optimizing SQL and PySpark data pipelines, as well as implementing ETL processes and working with Informatica. Through this technical background, I discovered my passion for translating complex data into actionable insights and bridging the gap between business needs and technical implementation. I am now focused on developing my BSA expertise by performing requirements analysis, documenting system specifications, supporting Agile delivery, and validating outputs against business objectives. Combining technical proficiency with strong analytical thinking and clear communication, I aim to deliver solutions that align with stakeholder goals and enhance operational efficiency.

